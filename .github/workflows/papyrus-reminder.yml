name: Papyrus monthly reminder

# Repo-backed backup for the newsletter send-reminder. On the 1st of each month
# it opens a GitHub issue naming this month's drafted issue and the send steps,
# so the reminder survives even if the external Claude-Code-Remote trigger is
# ever deleted. It NEVER sends — the human runs the "Send The Papyrus" Action.

on:
  schedule:
    - cron: '0 8 1 * *'      # 08:00 UTC on the 1st (after the external trigger's 07:00)
  workflow_dispatch: {}        # manual test button

permissions:
  contents: read
  issues: write

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10       # opens an issue; no network work of its own.
    steps:
      - uses: actions/checkout@v4
      - name: Open this month's send reminder
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const now = new Date();
            const ym = `${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}`;
            const dir = 'site/newsletter/issues';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            const match = files.find(f => f.startsWith(ym));
            let title, body;
            if (match) {
              const slug = match.replace('.json', '');
              const issue = JSON.parse(fs.readFileSync(`${dir}/${match}`, 'utf8'));
              title = `📬 Send The Papyrus — ${slug}`;
              body = [
                `It's ${ym}. This month's issue is drafted and ready:`,
                ``,
                `**${issue.subject}**`,
                `slug: \`${slug}\``,
                ``,
                `To send: run the **Send The Papyrus** Action → slug \`${slug}\` → \`dry\` to preview the recipient count, then \`live\`.`,
                ``,
                `_Automated monthly reminder (repo backup for the external trigger). It does not send anything — you do. Close this once sent._`,
              ].join('\n');
            } else {
              title = `📬 The Papyrus — no issue drafted for ${ym}`;
              body = `It's ${ym} and no issue file is dated for this month in \`${dir}\`. Draft one, or send an earlier unsent slug.\n\n_Automated monthly reminder._`;
            }
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100,
            });
            if (open.some(i => i.title === title)) { core.notice('Reminder already open for this month'); return; }
            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body,
            });
            core.notice(`Opened reminder #${created.number}`);

      # A newsletter that silently fails to send looks identical to a quiet
      # week. Every pipeline that commits data already opens an issue on
      # failure; the two workflows whose whole job is to make something happen
      # on a schedule were the ones with no way to tell you it did not.
      # There is no pipeline output to tee here — the one working step is a
      # github-script call — so the reason is built from what is actually known:
      # the month it was reminding about and whether an issue file existed for
      # it. That is thin, and it is still the difference between "the workflow
      # failed" and "it failed while trying to open the reminder for 2026-09".
      - name: Collect what the run said about itself
        if: '!cancelled()'
        id: why
        shell: bash
        run: |
          ym=$(date -u +%Y-%m)
          issue=$(ls site/newsletter/issues/${ym}*.json 2>/dev/null | head -1)
          {
            echo 'text<<PAPYRUS_EOF'
            echo "Opening the monthly send reminder for ${ym}."
            if [ -n "$issue" ]; then
              echo "Drafted issue found: $(basename "$issue" .json)"
            else
              echo "No drafted issue for ${ym} in site/newsletter/issues/ —"
              echo "the reminder would have said so rather than naming a slug."
            fi
            echo 'PAPYRUS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        # failure() alone misses a TIMEOUT: GitHub records a job killed at
        # timeout-minutes as CANCELLED, not failed - which is how the 2026-10-05
        # street refresh ran out of time and told nobody. This workflow never
        # cancels itself, so a cancellation here is a timeout or a person.
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ job.status == 'cancelled' && 'Cancelled, not failed - most often the job hit its timeout-minutes limit, which GitHub records as a cancellation. The last lines of the log show where it stopped.' || steps.why.outputs.text }}
