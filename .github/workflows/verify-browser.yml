# Every push to main is pulled straight onto Hostinger by its Git auto-deploy,
# so a visual or accessibility regression reaches users before anyone looks.
# The browser half of backend/verify/ is what would catch that, and it cannot
# run on the authoring workstation: %LOCALAPPDATA%\ms-playwright\...\chrome.exe
# is execution-blocked there (a direct `chrome.exe --version` returns
# "Permission denied", and Playwright surfaces the same refusal as
# `spawn UNKNOWN`). Nothing about Playwright's configuration works around that,
# so the checks run here instead, where Chromium is executable and a local
# server is unremarkable.
name: Verify (browser)

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'backend/verify/**'
      - '.github/workflows/verify-browser.yml'
      - '.github/scripts/verify-gate.sh'
  pull_request:
    paths:
      - 'site/**'
      # The checkers themselves. Until 2026-11-06 a pull request that changed
      # only a checker (PR #76: map-interaction.js) ran NO browser checks, so a
      # checker's own change was first exercised on main. Push already listed
      # this path; pull_request did not.
      - 'backend/verify/**'
      # the workflow itself, so a change to it can be tested on a branch:
      # workflow_dispatch only works from the default branch, so a PR is the
      # only way to exercise this before it lands on main.
      - '.github/workflows/verify-browser.yml'
      - '.github/scripts/verify-gate.sh'
  # The full sweep, mutate.py included, once a week whatever changed. Pull
  # requests and pushes now run mutate.py only when something it depends on
  # changed (see verify-gate.sh), so this is what catches a page edit that
  # quietly moved the text one of its cases anchors on.
  schedule:
    - cron: '41 3 * * 1'   # 03:41 UTC Monday; off the hour on purpose
  workflow_dispatch: {}

# A second push while a sweep is running should supersede it rather than queue:
# the later commit is the one whose result anyone cares about.
concurrency:
  group: verify-browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read            # verify-gate.sh asks whether the PR head's sweep passed
  issues: write            # open a failure-alert issue via notify-failure

jobs:
  # Decides, in under a minute, whether the 38-minute sweep below is needed and
  # whether mutate.py is. On 2026-11-08 the account's Actions minutes ran out
  # and GitHub stopped starting jobs, the daily data refreshes included; this
  # sweep had used 2,055 of the 2,366 minutes measured since 1 October, half of
  # them repeating a check on a merge commit identical to the PR it came from.
  # The reasoning, and why it fails open, is in .github/scripts/verify-gate.sh.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      mutate: ${{ steps.decide.outputs.mutate }}
      browser: ${{ steps.decide.outputs.browser }}
    steps:
      # Full history without file contents: the gate reads commits and trees
      # (rev-parse, diff --name-only), never blobs, so this stays small.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Decide what to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-gate.sh
      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          reason: "verify-gate.sh failed, so the browser checks did not run for this commit. Re-run the workflow; the gate is designed to fail open, so a failure here is itself a bug."

  browser-checks:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 35, not 25: run 31515324032 ended `cancelled` on the timeout even
    # though every step had reported, which reads as an infrastructure
    # problem rather than the site finding it actually was. mutate.py
    # alone drives sixteen cases, several through a browser.
    #
    # 50, not 35 (2026-11-04): the suite had grown into its own ceiling.
    # Measured full runs: 33m-34m on 10-04/10-09, 34m47s for PR #61. PR #62
    # added one page and run 41844732771 was `cancelled` at 35m24s with every
    # step green and mutate.py at 40/40 — it finished 19 s past the cap. Each
    # new page adds time to every browser checker, so the headroom has to
    # grow with the site. If a run nears 45m, split mutate.py into its own job
    # rather than raising this again.
    timeout-minutes: 50

    env:
      BASE: http://localhost:8793
      VERIFY_LOG_DIR: ${{ github.workspace }}/verify-logs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # checks.py's `workflows` subcommand imports yaml. The workstation has
      # PyYAML installed, so this only shows up on a clean runner — which is
      # the point of running here rather than only where it happens to pass.
      - name: Python dependencies
        run: python3 -m pip install --quiet pyyaml

      # env.js resolves playwright-core from node_modules or PLAYWRIGHT_CORE.
      # This repo has no package.json, so install into a scratch directory and
      # name the path explicitly rather than relying on module resolution.
      # Its own ceiling, and bounded apt fetches. Run 42275508065 (PR #83,
      # 2026-11-06) spent 14m27s here instead of the usual ~30 s: the Ubuntu
      # mirror trickled Chromium's font packages (one gap of 392 s between two
      # log lines). Every checker then passed, but mutate.py finished at the
      # job's 50-minute cap and the run read `cancelled`, as if the site had
      # failed. With the step capped at 12 minutes a stalled mirror fails HERE,
      # under this step's name, and leaves the checkers their usual ~36 minutes.
      # The cure for a stall is a re-run; nothing in the site causes it.
      - name: Install playwright-core and Chromium
        if: needs.gate.outputs.browser == 'true'
        timeout-minutes: 12
        run: |
          # A fetch that stalls for 20 s is dropped and retried, instead of
          # waiting out apt's default timeout on a dying connection.
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "5";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-egybi-fetch-timeouts >/dev/null
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm i --no-audit --no-fund playwright-core@1.62.1
          npx --yes playwright@1.62.1 install --with-deps chromium
          echo "PLAYWRIGHT_CORE=$RUNNER_TEMP/pw/node_modules/playwright-core" >> "$GITHUB_ENV"

      - name: Resolve the Chromium binary
        if: needs.gate.outputs.browser == 'true'
        run: |
          # env.js takes the highest chromium-* build under PLAYWRIGHT_BROWSERS_PATH.
          # Name the executable outright so a layout change surfaces here rather
          # than as a launch failure three steps later.
          exe=$(find "$HOME/.cache/ms-playwright" -name chrome -type f -path '*chrome-linux*' | sort | tail -1)
          test -n "$exe" || { echo "::error::no Chromium found under ~/.cache/ms-playwright"; exit 1; }
          echo "CHROME=$exe" >> "$GITHUB_ENV"
          echo "using $exe"

      - name: Serve site/ on 8793
        if: needs.gate.outputs.browser == 'true'
        run: |
          mkdir -p "$VERIFY_LOG_DIR"
          python3 -m http.server 8793 --directory site >"$VERIFY_LOG_DIR/server.log" 2>&1 &
          # Wait for a real 200 rather than sleeping: a fixed sleep either wastes
          # time or races, and a sweep against a server that is not up yet fails
          # every page for the wrong reason.
          for i in $(seq 1 40); do
            curl -fsS -o /dev/null "$BASE/index.html" && { echo "server up after ${i}00ms"; exit 0; }
            sleep 0.1
          done
          echo "::error::server never answered on $BASE"; exit 1

      # EVERY checker below runs through backend/verify/ci-step.sh, which tees
      # its output into $VERIFY_LOG_DIR and records its name if it failed. That
      # is what lets the failure alert at the bottom say WHICH checker broke and
      # what it printed: issue #54 carried three days of "the workflow failed"
      # while the diagnosis sat in a log nobody opened, and with `if: always()`
      # on seventeen steps the run summary does not name the failing one either.
      # The script keeps `set -o pipefail`, so a teed checker that fails still
      # fails the step rather than handing the run tee's exit status of 0.
      #
      # The static checks first: they are fast, and a broken link or a missing
      # data field explains browser findings that would otherwise look like
      # rendering bugs.
      # Every PHP file under site/ (the API, sign-in, the analytics dashboard)
      # goes live on the next push, and nothing parsed it first: there is no
      # PHP on the authoring workstation either. `php -l` is a syntax check
      # only - it cannot see a runtime error - but one parse error takes a
      # whole endpoint down, and this is the only place it can be caught.
      - name: php-lint
        run: |
          backend/verify/ci-step.sh php-lint bash -c '
            set -o pipefail
            php --version | head -1
            n=0; bad=0
            while IFS= read -r -d "" f; do
              n=$((n+1))
              out=$(php -l "$f" 2>&1) || { echo "$out"; bad=$((bad+1)); }
            done < <(find site -name "*.php" -print0)
            echo "php -l: $n files, $bad with syntax errors"
            [ "$n" -gt 0 ] && [ "$bad" -eq 0 ]'

      # The account endpoints end to end: PHP's built-in server on a throwaway
      # SQLite database, two users, every action through curl, and a direct
      # read of the database proving a deletion removed every row. php -l above
      # only proves the files parse; this proves sign-in, CSRF, ownership and
      # deletion behave.
      - name: auth-flow.sh
        if: always()
        run: backend/verify/ci-step.sh auth-flow bash backend/verify/auth-flow.sh

      - name: static-audit.py
        run: backend/verify/ci-step.sh static-audit python3 backend/verify/static-audit.py

      - name: coverage.py
        run: backend/verify/ci-step.sh coverage python3 backend/verify/coverage.py

      - name: checks.py
        run: |
          for c in orphans workflows secrets fra; do
            backend/verify/ci-step.sh "checks-$c" \
              python3 backend/verify/checks.py "$c" || fail=1
          done
          exit ${fail:-0}

      # seo.py judges the CORPUS, which is the one thing none of the others
      # look at. 123 retired pages sat live and indexable against 27 real ones
      # for months — 82% of everything crawlable — and Google read the domain's
      # identity off them. Every single one of those pages passed a per-page
      # audit, so no page-level checker could ever have found it. It runs here
      # with the other static checks because it needs no browser.
      - name: seo.py
        if: always()
        run: backend/verify/ci-step.sh seo python3 backend/verify/seo.py

      # map-completeness.py asks whether a map EXPLAINS, which every other
      # checker here takes for granted. "A century of plans" rendered
      # perfectly, passed contrast, passed interaction, and was still three
      # unlabelled gold shapes on a pale field. Rendering and explaining fail
      # differently and only one of them shows up in a screenshot.
      - name: map-completeness.py
        if: always()
        run: backend/verify/ci-step.sh map-completeness python3 backend/verify/map-completeness.py

      # workflow-audit.py asks about the FLEET rather than the site: does every
      # workflow that can fire with nobody watching also tell somebody when it
      # breaks. It existed for days, found two real-looking gaps, printed them
      # and exited 0 — and ran in no workflow at all, so nothing ever read the
      # finding. A checker wired into nothing has never run.
      - name: workflow-audit.py
        if: always()
        run: backend/verify/ci-step.sh workflow-audit python3 backend/verify/workflow-audit.py

      # Where the analytics beacon actually lands, from root and folder pages.
      # A relative 'api/hit.php' sent the 153 folder pages' views to a 404
      # until 2026-11-09. No browser needed: it runs analytics.js in a stub.
      - name: beacon-url.js
        if: always()
        run: backend/verify/ci-step.sh beacon-url node backend/verify/beacon-url.js

      # Every browser step below runs only when the gate says something a
      # browser renders changed (browser=true): a page, a shared asset or a
      # browser checker. A change to data, charts, PHP or docs runs the static
      # checks above and stops. Scheduled and manual runs render everything.
      #
      # Each browser checker is its own step so the summary names which one
      # failed, rather than one red block covering nine tools.
      #
      # if: always() on every one of them, because fail-fast is build semantics
      # and this is a verification sweep. tap-targets.js failing once skipped
      # map-render, map-contrast AND map-interaction — including the run whose
      # entire purpose was to print an off-origin path. One checker's finding
      # must not hide three others'; a sweep should report everything in one
      # pass. Setup steps stay fail-fast: if the server or Chromium is missing,
      # every checker fails for the same uninformative reason.
      - name: all-pages.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh all-pages node backend/verify/all-pages.js

      - name: overflow.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh overflow node backend/verify/overflow.js

      - name: contrast.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh contrast node backend/verify/contrast.js

      # Not a check: full-page screenshots of the main layouts at 1280 and
      # 390 px, saved into the uploaded log folder, so a person can SEE a visual
      # change. The workstation cannot render these pages itself (no local
      # server; the browser pane opens a local page without its stylesheet).
      - name: shots.js (screenshots, not a check)
        if: always() && needs.gate.outputs.browser == 'true'
        run: node backend/verify/shots.js

      - name: cssom.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh cssom node backend/verify/cssom.js

      - name: reduced.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh reduced node backend/verify/reduced.js

      - name: a11y2.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh a11y2 node backend/verify/a11y2.js

      - name: tap-targets.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh tap-targets node backend/verify/tap-targets.js

      - name: map-render.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh map-render node backend/verify/map-render.js

      - name: map-contrast.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh map-contrast node backend/verify/map-contrast.js

      - name: map-interaction.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh map-interaction node backend/verify/map-interaction.js

      # "Save this place" on the visitor pages and the account page's place
      # list, against a played account service (the real PHP one is tested by
      # auth-flow.sh above).
      - name: save-place.js
        if: always() && needs.gate.outputs.browser == 'true'
        run: backend/verify/ci-step.sh save-place node backend/verify/save-place.js

      # A clean sweep is only evidence if the checkers can still fire. This is
      # the argument backend/verify/README.md makes, and it is why an earlier
      # "0/32 checkers work" turned out to be a dead python3 alias rather than
      # sixteen broken checks.
      # if: always() because whether the checkers can fire is independent of
      # whether the site passes. A site finding suppressing this one is
      # backwards — a red sweep is exactly when you most need to know the
      # checkers are trustworthy. map-interaction.js failing has already
      # skipped this step once, leaving the question unanswered.
      #
      # Gated since 2026-11-08: at 17.5 of the run's 38 minutes it is the
      # single largest cost, and it tests the checkers, not the site. The gate
      # runs it whenever a checker, this workflow, the gate, or a file it
      # mutates changed, and on every scheduled (weekly) or manual run.
      - name: mutate.py — the check on the checks
        if: always() && needs.gate.outputs.mutate == 'true'
        run: backend/verify/ci-step.sh mutate python3 backend/verify/mutate.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: ${{ env.VERIFY_LOG_DIR }}
          if-no-files-found: ignore
          retention-days: 14

      # What the failing checkers actually said, lifted out of their own logs.
      # Runs on any outcome because its whole job is to describe steps that have
      # already reported; on a green sweep FAILED does not exist and this
      # produces nothing, which is what the alert step below then does not use.
      #
      # tail rather than the whole log: every checker in this directory prints
      # its findings last, after a header and a per-page table, and 4000
      # characters is all notify-failure will carry anyway.
      - name: Collect what the failing checkers said
        if: always()
        id: why
        shell: bash
        run: |
          {
            echo 'text<<VERIFY_EOF'
            if [ -s "$VERIFY_LOG_DIR/FAILED" ]; then
              while read -r n; do
                echo "--- $n"
                tail -18 "$VERIFY_LOG_DIR/$n.log" 2>/dev/null || echo "(no output captured)"
                echo
              done < "$VERIFY_LOG_DIR/FAILED" | head -110
            else
              echo "No checker recorded a failure, so the run broke before or"
              echo "around them — setup, the preview server, or the job timeout."
            fi
            echo 'VERIFY_EOF'
          } >> "$GITHUB_OUTPUT"

      # The only workflow standing between an edit and production had no
      # failure alerting at all, which every scheduled pipeline here already
      # has. Every push to main is a live Hostinger deploy, so a red sweep on
      # this workflow is the single most important failure in the repo — and
      # it was the one nobody was told about. It went unnoticed for six
      # sessions that tap-targets.js was taking three other checkers down with
      # it, which is exactly what silence buys.
      #
      # Last, so it fires after every checker has reported rather than on the
      # first one to fail, and if: failure() rather than always() so a green
      # sweep stays quiet.
      #
      # `reason:` is what turns the alert from a notification into a diagnosis.
      # Without it every one of these issues is the same sentence and a link,
      # and #54 collected three days of exactly that.
      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ steps.why.outputs.text }}
