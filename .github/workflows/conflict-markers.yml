# Fails if any tracked file holds a merge-conflict marker.
#
# On 2026-11-06 a merge between two stacked pull requests was "resolved" by a
# script that found nothing to resolve. The vault Changelog was committed and
# pushed with raw <<<<<<< / >>>>>>> markers on two branches. Nothing caught it,
# because no check runs on a change to the vault alone; a verification by
# hand did. This is the check: seconds long, on every pull request whatever it
# touches, and on every push to main.
#
# Only the two unambiguous markers are matched, at the start of a line and
# followed by a space. A bare ======= is also a Markdown heading underline,
# so it is not matched.
#
# Second check, same job (one job rounds to one billed minute; a second job
# would add a minute to every push): backend/verify/cache-bump.py. Assets are
# served `immutable` for a week and the CDN caches by URL, so an asset that
# changed must be requested under a new ?v=. PR #98 changed account.js under
# its old version, and the CDN then served old and new copies at random.
name: Conflict markers

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: conflict-markers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write            # open a failure-alert issue via notify-failure

jobs:
  markers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history (10 MB): the version check compares with the PR's base or
      # the commit before the push, and reads that commit's files.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No conflict markers in any tracked file
        shell: bash
        run: |
          set -o pipefail
          # git grep exits 1 when nothing matches, which is the passing case.
          if git grep -nIE '^(<<<<<<<|>>>>>>>) ' -- . ':(exclude).github/workflows/conflict-markers.yml' | tee /tmp/markers.log; then
            echo "::error::merge-conflict markers are committed in the files above"
            exit 1
          fi
          echo "no conflict markers in $(git ls-files | wc -l) tracked files"

      - name: Every changed asset is requested under a new version
        if: '!cancelled()'
        shell: bash
        env:
          # The PR's base, or the commit before a push. Empty for a manual run,
          # where the script compares with the commit before HEAD.
          CACHE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -o pipefail
          python3 backend/verify/cache-bump.py 2>&1 | tee /tmp/cache-bump.log

      - name: Collect what the run said about itself
        if: failure() && github.event_name == 'push'
        id: why
        shell: bash
        run: |
          {
            echo 'text<<WHY_EOF'
            [ -s /tmp/markers.log ] && { echo "Merge-conflict markers were committed to main:"; head -n 10 /tmp/markers.log; }
            grep -E '^FAIL' /tmp/cache-bump.log 2>/dev/null | head -n 10
            echo 'WHY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        if: failure() && github.event_name == 'push'
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ steps.why.outputs.text }}
