name: Probe district geocodes

# READ-ONLY diagnostic for the street report card. Writes and commits nothing.
#
# Exists so that fixing a failed district geocode does not require editing
# fetch_streets.py and running the real pipeline — that costs ~20 minutes and a
# full Cairo street-graph download per guess, and hammers a free shared API to
# answer a question that geocoding alone can answer in seconds.
#
# Same shape as probe-idsc.yml: manual only, no permissions beyond reading the
# repo, no commit step, no failure alert (you are watching it run).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pipeline/requirements-streets.txt

      - name: Install the geospatial stack (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/pipeline/requirements-streets.txt

      - name: Probe the candidate geocodes
        run: python backend/pipeline/probe_geocodes.py
