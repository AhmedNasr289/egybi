name: Refresh Egypt data

# Automatically pulls the latest World Bank indicators for Egypt, rebuilds the
# bundled knowledge-base SQLite database, and commits it back. That push then
# triggers the Hostinger auto-deploy, so the live site's data refreshes with no
# manual steps. Runs monthly (World Bank data changes slowly) and on demand.

on:
  schedule:
    # Off the hour for the same reason as refresh-prices: :00 is the most
    # contended minute on GitHub's shared scheduler.
    # Weekly (Mondays), not daily: World Bank indicators update only a few times
    # a year, so a daily run would re-fetch 7x/week to find no change (the
    # dry-run diff-guard below still means nothing is committed on a no-change
    # run — this just avoids burning Actions minutes for nothing).
    - cron: '41 3 * * 1'     # 03:41 UTC every Monday
  workflow_dispatch: {}       # manual "Run workflow" button in the Actions tab

permissions:
  contents: write             # needed to push the refreshed data back
  issues: write             # open a failure-alert issue via notify-failure

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # World Bank indicators plus a SQLite rebuild.
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tee'd, so the reasons the script prints survive the step that failed.
      # fetch_worldbank.py is precise about what went wrong — on 2026-08-17 it
      # printed "9 of 11 indicators failed: NY.GDP.MKTP.CD (HTTP 502), ..." and
      # "Refusing to write seed_auto.sql — publishing it would delete the failed
      # indicators' rows" — and issue #42 recorded none of it, because the alert
      # was given no reason to carry. The diagnosis existed and was thrown away.
      #
      # pipefail is what keeps the step failing: without it the pipe's exit
      # status is tee's, which is always 0, and a refusal to publish would go
      # green.
      - name: Fetch latest World Bank indicators (stdlib only, no pip)
        shell: bash
        run: |
          set -o pipefail
          python backend/pipeline/fetch_worldbank.py 2>&1 | tee /tmp/wb-refresh.log

      - name: Detect whether anything actually changed
        id: check
        run: |
          if [ -n "$(git status --porcelain -- backend/sql/seed_auto.sql)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No indicator changes from the World Bank — nothing to publish."
          fi

      - name: Guard against an empty or broken fetch
        if: steps.check.outputs.changed == 'true'
        shell: bash
        run: |
          set -o pipefail
          {
          # Counts INSERT *statements*, not rows — the name below says "rows" and
          # it never did. Kept as an absolute floor, but it is a backstop now,
          # not the control: fetch_worldbank.py refuses a partial fetch outright,
          # because seed_auto.sql deletes the indicator codes it owns before
          # re-inserting, so a run that lost indicators deletes their history.
          inserts=$(grep -c "INSERT" backend/sql/seed_auto.sql || true)
          echo "seed_auto.sql INSERT statements: $inserts"
          if [ "${inserts:-0}" -lt 20 ]; then
            echo "::error::Refusing to publish — only $inserts INSERT statements (likely a failed/empty fetch)."
            exit 1
          fi
          # An absolute floor cannot see a file that shrank from 76 to 40: both
          # clear 20. Compare against the committed last-good instead, which is
          # the only number that knows what "smaller than before" means.
          prev=$(git show HEAD:backend/sql/seed_auto.sql 2>/dev/null | grep -c "INSERT" || echo 0)
          echo "previous committed: $prev"
          if [ "${prev:-0}" -gt 0 ] && [ "$inserts" -lt "$prev" ]; then
            echo "::error::Refusing to publish — $inserts INSERT statements against $prev committed. The World Bank dropped indicators; publishing would delete their rows."
            exit 1
          fi
          } 2>&1 | tee -a /tmp/wb-refresh.log

      - name: Rebuild + verify the bundled KB database
        if: steps.check.outputs.changed == 'true'
        run: |
          python backend/test/build_test_db.py     # exits non-zero on any SQL/FK error
          cp backend/test/egybi_test.sqlite backend/data/egybi_kb.sqlite

      - name: Commit & push the refreshed data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "egybi-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/sql/seed_auto.sql backend/data/egybi_kb.sqlite
          git commit -m "Automated data refresh — World Bank indicators [skip ci]"
          # main can move while this job runs (a manual push, or a sibling
          # workflow). Without a rebase the push is rejected as non-fast-forward
          # and the refresh silently stops happening. Retry a few times.
          for attempt in 1 2 3; do
            # Rebase against the ref this run was dispatched on rather than a
            # hardcoded main. These are cron-or-push on main in normal use, but
            # all four accept workflow_dispatch, so any of them CAN be aimed at a
            # branch — and there the rebase onto main rewrites the branch history
            # and the push is rejected as a non-fast-forward, discarding the work.
            # refresh-streets hit exactly this. On main the behaviour is identical.
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push attempt $attempt failed; retrying in 5s"; sleep 5
          done
          echo "::error::could not push after 3 attempts"; exit 1

      # Runs on any outcome, because its whole job is to describe a step that
      # has already failed.
      - name: Collect what the run said about itself
        if: '!cancelled()'
        id: why
        shell: bash
        run: |
          {
            echo 'text<<WB_EOF'
            grep -E '(fetch failed|indicators failed|Refusing to|::error::)' \
              /tmp/wb-refresh.log 2>/dev/null | head -20 || true
            echo 'WB_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ steps.why.outputs.text }}
