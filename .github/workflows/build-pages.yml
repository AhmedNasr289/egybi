name: Rebuild static pages

# The challenge catalogue and the blog live in JavaScript files. Whenever either
# changes, every per-challenge and per-post HTML page (and the sitemap) is
# regenerated and committed, so the indexable pages can never drift from the
# real content.
#
# No loop risk: pushes made with GITHUB_TOKEN do not trigger further workflows.

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/challenges.js'
      - 'site/assets/blog-posts.js'
      - 'backend/pipeline/build_static_pages.py'
      # site/blog.html is the fourth input and was missing. The generator lifts
      # the shared nav and footer out of it at build time (build_static_pages.py
      # line ~142) precisely so the 135 generated pages cannot drift from the
      # real site — but with blog.html outside this list, editing the nav
      # changed the live pages and left all 135 generated ones on the old
      # markup, which is the exact drift the design was meant to prevent. The
      # docstring already said "editing blog.html's nav therefore updates all
      # 135 generated pages"; it just never ran.
      - 'site/blog.html'
      # Any hand-edited page. Its sitemap <lastmod> is now the date its own
      # content last changed (sitemap_lastmod.py), so an edit has to rebuild
      # the sitemap to show up there — and to be announced via IndexNow.
      - 'site/*.html'
      - 'site/data/visit-climate.json'
      - 'site/data/visit-terrain.json'
      - 'backend/pipeline/sitemap_lastmod.py'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write             # open a failure-alert issue via notify-failure

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # pure generation from files already in the repo — no network.
                               # Without a bound a hung request runs for
                               # GitHub's default six hours.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: each page's sitemap <lastmod> is the date of the last
          # commit that touched it. In a depth-1 clone every file appears to
          # come from the one grafted commit, so sitemap_lastmod.py refuses to
          # use git dates at all there and would fall back to data dates only.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tee'd so the alert can name what the generator objected to. This one
      # owns 135+ pages and fires on every push to main, which Hostinger deploys
      # straight to production — so its failures are unattended in every sense
      # that matters, and "the workflow failed" is not a diagnosis.
      - name: Regenerate per-challenge and per-post pages
        shell: bash
        run: |
          set -o pipefail
          # First, so an edit to prices.html reaches prices-ar.html (derived
          # from it) before the sitemap dates are worked out.
          python backend/pipeline/build_prices_pages.py 2>&1 | tee /tmp/build-pages.log
          SITEMAP_CHANGED_OUT=/tmp/changed-urls.txt \
            python backend/pipeline/build_static_pages.py 2>&1 | tee -a /tmp/build-pages.log

      # Everything this job commits is GENERATED, so nothing is rebased: each
      # push attempt rebuilds on top of the latest main (refresh-prices edits
      # sitemap.xml and the prices pages too, and a rebase of generated files
      # across that is a conflict - see .github/scripts/push-with-regenerate.sh).
      # site/visit and visit.html are written by the same generator (one page
      # per measured site, and the index block that links them) and were once
      # missing from this list, so a CI rebuild of them was thrown away.
      - name: Commit if anything changed
        run: |
          bash .github/scripts/push-with-regenerate.sh \
            "Regenerate static challenge and post pages [skip ci]" \
            "" \
            "site/practice site/papyrus site/visit site/visit.html site/prices.html site/prices-ar.html site/sitemap.xml" \
            "python backend/pipeline/build_prices_pages.py && SITEMAP_CHANGED_OUT=/tmp/changed-urls.txt python backend/pipeline/build_static_pages.py"

      # Runs only after the push above succeeded (or there was nothing to
      # push). Never fails the job: see indexnow_ping.py.
      - name: Announce changed URLs (IndexNow)
        run: python backend/pipeline/indexnow_ping.py /tmp/changed-urls.txt

      - name: Collect what the run said about itself
        if: '!cancelled()'
        id: why
        shell: bash
        run: |
          {
            echo 'text<<PAGES_EOF'
            grep -E '(Traceback|Error|error:|WARN|SKIP|::error::)' \
              /tmp/build-pages.log 2>/dev/null | head -20 || true
            echo 'PAGES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ steps.why.outputs.text }}
