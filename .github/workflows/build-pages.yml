name: Rebuild static pages

# The challenge catalogue and the blog live in JavaScript files. Whenever either
# changes, every per-challenge and per-post HTML page (and the sitemap) is
# regenerated and committed, so the indexable pages can never drift from the
# real content.
#
# No loop risk: pushes made with GITHUB_TOKEN do not trigger further workflows.

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/challenges.js'
      - 'site/assets/blog-posts.js'
      - 'backend/pipeline/build_static_pages.py'
      # site/blog.html is the fourth input and was missing. The generator lifts
      # the shared nav and footer out of it at build time (build_static_pages.py
      # line ~142) precisely so the 135 generated pages cannot drift from the
      # real site — but with blog.html outside this list, editing the nav
      # changed the live pages and left all 135 generated ones on the old
      # markup, which is the exact drift the design was meant to prevent. The
      # docstring already said "editing blog.html's nav therefore updates all
      # 135 generated pages"; it just never ran.
      - 'site/blog.html'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write             # open a failure-alert issue via notify-failure

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # pure generation from files already in the repo — no network.
                               # Without a bound a hung request runs for
                               # GitHub's default six hours.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tee'd so the alert can name what the generator objected to. This one
      # owns 135+ pages and fires on every push to main, which Hostinger deploys
      # straight to production — so its failures are unattended in every sense
      # that matters, and "the workflow failed" is not a diagnosis.
      - name: Regenerate per-challenge and per-post pages
        shell: bash
        run: |
          set -o pipefail
          python backend/pipeline/build_static_pages.py 2>&1 | tee /tmp/build-pages.log

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain -- site/practice site/papyrus site/sitemap.xml)" ]; then
            git config user.name  "egybi-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/practice site/papyrus site/sitemap.xml
            git commit -m "Regenerate static challenge and post pages [skip ci]"
            # main can move while this job runs (a manual push, or a sibling
            # workflow). Without a rebase the push is rejected as non-fast-forward
            # and the refresh silently stops happening. Retry a few times.
            for attempt in 1 2 3; do
            # Rebase against the ref this run was dispatched on rather than a
            # hardcoded main. These are cron-or-push on main in normal use, but
            # all four accept workflow_dispatch, so any of them CAN be aimed at a
            # branch — and there the rebase onto main rewrites the branch history
            # and the push is rejected as a non-fast-forward, discarding the work.
            # refresh-streets hit exactly this. On main the behaviour is identical.
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
                 && git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "pushed on attempt $attempt"; exit 0
              fi
              echo "push attempt $attempt failed; retrying in 5s"; sleep 5
            done
            echo "::error::could not push after 3 attempts"; exit 1
          else
            echo "Static pages already up to date."
          fi

      - name: Collect what the run said about itself
        if: '!cancelled()'
        id: why
        shell: bash
        run: |
          {
            echo 'text<<PAGES_EOF'
            grep -E '(Traceback|Error|error:|WARN|SKIP|::error::)' \
              /tmp/build-pages.log 2>/dev/null | head -20 || true
            echo 'PAGES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ steps.why.outputs.text }}
