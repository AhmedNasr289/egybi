name: Rebuild static pages

# The challenge catalogue and the blog live in JavaScript files. Whenever either
# changes, every per-challenge and per-post HTML page (and the sitemap) is
# regenerated and committed, so the indexable pages can never drift from the
# real content.
#
# No loop risk: pushes made with GITHUB_TOKEN do not trigger further workflows.

on:
  push:
    branches: [main]
    paths:
      - 'site/assets/challenges.js'
      - 'site/assets/blog-posts.js'
      - 'backend/pipeline/build_static_pages.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate per-challenge and per-post pages
        run: python backend/pipeline/build_static_pages.py

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain -- site/practice site/papyrus site/sitemap.xml)" ]; then
            git config user.name  "egybi-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/practice site/papyrus site/sitemap.xml
            git commit -m "Regenerate static challenge and post pages [skip ci]"
            git push
          else
            echo "Static pages already up to date."
          fi
