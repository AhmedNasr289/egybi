name: Refresh daily prices

# Fetches the latest Egyptian retail/wholesale prices from the official IDSC
# (Cabinet) price API and commits the two JSON files the Prices page reads.
# That push triggers the Hostinger auto-deploy, so prices update daily on the
# live site with no manual steps. fetch_prices.py has its own guardrail: if the
# API is unreachable or the item count collapses, it keeps the last-good files
# (so a bad day never overwrites good data) and this job simply finds nothing to
# commit.

on:
  schedule:
    # Deliberately NOT on the hour. GitHub's shared scheduler is most
    # contended at :00 and runs there are the most likely to be delayed or
    # dropped — this workflow never once fired while sitting at 07:00.
    - cron: '17 7 * * *'      # 07:17 UTC daily (~09:17 Cairo, after the morning update)
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write
  issues: write             # open a failure-alert issue via notify-failure

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 25       # one IDSC scrape plus history merge.
                               # Without a bound a hung request runs for
                               # GitHub's default six hours.
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tee'd for the same reason build-geo-assets is: the script and the
      # staleness guard both name what went wrong — an unreachable source, or
      # "IDSC prices are N days stale" — and without this the alert
      # carries none of it and reads only "the workflow failed". pipefail keeps
      # a failed fetch failing; without it the pipe's status is tee's, always 0.
      - name: Fetch latest IDSC prices (stdlib only, no pip)
        shell: bash
        run: |
          set -o pipefail
          python backend/pipeline/fetch_prices.py 2>&1 | tee /tmp/prices-refresh.log

      - name: Fail (→ alert) if the data has gone stale
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a /tmp/prices-refresh.log
          import json, datetime, sys
          d = json.load(open("site/data/prices-today.json"))
          as_of = (d.get("retail") or {}).get("as_of") or d.get("fetched_at")
          age = (datetime.date.today() - datetime.date.fromisoformat(as_of)).days
          print(f"prices as_of {as_of} — {age} day(s) old")
          # The pipeline keeps last-good data on a bad fetch, so a frozen source
          # is otherwise silent. Alert if the newest data is >5 days old (a
          # threshold that tolerates weekends + a public holiday).
          if age > 5:
              print(f"::error::Prices are {age} days stale (as_of {as_of}). The IDSC source may have stopped updating.")
              sys.exit(1)
          PY

      # THE ONLY CHANCE TO CHECK THIS DATA IS BEFORE IT IS COMMITTED.
      #
      # The bot's commit carries [skip ci], which skips every workflow — so
      # Verify (browser) never sees a data refresh, even though site/data/*.json
      # matches its `site/**` path filter. Twenty-two data commits reached
      # production unchecked between 2026-08-17 and 2026-08-28, and every push
      # to main is a live Hostinger deploy, so there is nothing between a
      # malformed data file and a reader.
      #
      # static-audit.py is the right check and costs a third of a second: it
      # validates that every data file is dated and internally consistent and
      # that every field the pages read is still present. Running it here rather
      # than after the push means a bad file is never committed at all.
      - name: Check the data before publishing it
        shell: bash
        run: |
          set -o pipefail
          python3 backend/verify/static-audit.py 2>&1 | tee -a /tmp/prices-refresh.log

      # prices.html is byte-identical day to day — its prices come from the JSON
      # above — so only this step can tell crawlers the page changed. It moves
      # that one URL's <lastmod> to the data's own date and touches nothing else.
      # No node, no page regeneration; a shallow clone is fine (data dates only).
      - name: Move the sitemap date of the prices page
        run: python backend/pipeline/sitemap_lastmod.py --changed-out /tmp/changed-urls.txt

      - name: Commit & push if prices changed
        run: |
          if [ -n "$(git status --porcelain -- site/data/prices-today.json site/data/prices-history.json site/sitemap.xml)" ]; then
            git config user.name  "egybi-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/prices-today.json site/data/prices-history.json site/sitemap.xml
            git commit -m "Automated daily price refresh — IDSC [skip ci]"
            # main can move while this job runs (a manual push, or a sibling
            # workflow). Without a rebase the push is rejected as non-fast-forward
            # and the refresh silently stops happening. Retry a few times.
            for attempt in 1 2 3; do
            # Rebase against the ref this run was dispatched on rather than a
            # hardcoded main. These are cron-or-push on main in normal use, but
            # all four accept workflow_dispatch, so any of them CAN be aimed at a
            # branch — and there the rebase onto main rewrites the branch history
            # and the push is rejected as a non-fast-forward, discarding the work.
            # refresh-streets hit exactly this. On main the behaviour is identical.
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
                 && git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "pushed on attempt $attempt"; exit 0
              fi
              echo "push attempt $attempt failed; retrying in 5s"; sleep 5
            done
            echo "::error::could not push after 3 attempts"; exit 1
          else
            echo "No price changes today (or the API guardrail kept last-good data)."
          fi

      # Only reached when the push succeeded or there was nothing to push.
      # Never fails the job: see indexnow_ping.py.
      - name: Announce the prices page (IndexNow)
        run: python backend/pipeline/indexnow_ping.py /tmp/changed-urls.txt

      # Runs on any outcome, because its whole job is to describe a step that
      # has already failed.
      - name: Collect what the run said about itself
        if: '!cancelled()'
        id: why
        shell: bash
        run: |
          {
            echo 'text<<PRICES_EOF'
            grep -E '(SKIP|FAILED|stale|unreachable|Refusing|::error::)' \
              /tmp/prices-refresh.log 2>/dev/null | head -20 || true
            echo 'PRICES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ steps.why.outputs.text }}
