name: Notify failure test
# TEMPORARY — proves the notify-failure composite action can open an issue with
# the built-in token. Calls the notifier unconditionally (no if:failure). Remove
# after one successful run.
on:
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fire the notifier once
        uses: ./.github/actions/notify-failure
