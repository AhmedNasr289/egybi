name: Refresh daily FX rates

# Fetches the latest Egyptian-pound exchange rates (market reference rates via
# ExchangeRate-API's free open endpoint) and commits the two JSON files the
# Prices page's currency band reads. That push triggers the Hostinger
# auto-deploy, so rates update daily with no manual steps. fetch_fx.py has its
# own guardrail: if the API is unreachable or returns too few currencies, it
# keeps the last-good files (a bad day never overwrites good data) and this job
# simply finds nothing to commit.

on:
  schedule:
    - cron: '23 7 * * *'      # 07:23 UTC daily: 09:23 Cairo in winter, 10:23 in summer time; off the hour on purpose
  workflow_dispatch: {}        # manual "Run workflow" button — use once to populate immediately

permissions:
  contents: write
  issues: write             # open a failure-alert issue via notify-failure

concurrency:
  group: refresh-fx
  cancel-in-progress: false

jobs:
  fx:
    runs-on: ubuntu-latest
    timeout-minutes: 15       # five currency pairs from one endpoint; generous even with backoff.
                               # Without a bound a hung request runs for
                               # GitHub's default six hours.
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tee'd for the same reason build-geo-assets is: the script and the
      # staleness guard both name what went wrong — an unreachable source, or
      # "ExchangeRate-API rates are N days stale" — and without this the alert
      # carries none of it and reads only "the workflow failed". pipefail keeps
      # a failed fetch failing; without it the pipe's status is tee's, always 0.
      - name: Fetch latest EGP exchange rates (stdlib only, no pip)
        shell: bash
        run: |
          set -o pipefail
          python backend/pipeline/fetch_fx.py 2>&1 | tee /tmp/fx-refresh.log

      - name: Fail (→ alert) if the rates have gone stale
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a /tmp/fx-refresh.log
          import json, datetime, sys
          d = json.load(open("site/data/fx-today.json"))
          as_of = d.get("as_of") or d.get("fetched_at")
          age = (datetime.date.today() - datetime.date.fromisoformat(as_of)).days
          print(f"fx as_of {as_of} — {age} day(s) old")
          # The pipeline keeps last-good rates on a bad fetch; alert if the
          # newest rates are >5 days old (the source updates daily).
          if age > 5:
              print(f"::error::FX rates are {age} days stale (as_of {as_of}). ExchangeRate-API may have stopped updating.")
              sys.exit(1)
          PY

      # THE ONLY CHANCE TO CHECK THIS DATA IS BEFORE IT IS COMMITTED.
      #
      # The bot's commit carries [skip ci], which skips every workflow — so
      # Verify (browser) never sees a data refresh, even though site/data/*.json
      # matches its `site/**` path filter. Twenty-two data commits reached
      # production unchecked between 2026-08-17 and 2026-08-28, and every push
      # to main is a live Hostinger deploy, so there is nothing between a
      # malformed data file and a reader.
      #
      # static-audit.py is the right check and costs a third of a second: it
      # validates that every data file is dated and internally consistent and
      # that every field the pages read is still present. Running it here rather
      # than after the push means a bad file is never committed at all.
      - name: Check the data before publishing it
        shell: bash
        run: |
          set -o pipefail
          python3 backend/verify/static-audit.py 2>&1 | tee -a /tmp/fx-refresh.log

      # The currency story is built from the FX history, and the food story's
      # dollar sentence reads it too. Without this step both would freeze on the
      # day they were written, because the general page build does not run on
      # data. Same bytes as build_static_pages.py writes.
      - name: Rebuild the pages drawn from the rates
        shell: bash
        run: |
          set -o pipefail
          python backend/pipeline/build_currency_story.py 2>&1 | tee -a /tmp/fx-refresh.log
          python backend/pipeline/build_food_prices.py 2>&1 | tee -a /tmp/fx-refresh.log

      # The rates JSON is DATA and is rebased; the pages and the sitemap are
      # GENERATED and are rebuilt on top of the latest branch tip on every push
      # attempt, never merged (see .github/scripts/push-with-regenerate.sh and
      # the 2026-11-04 race that lost a day's prices). Until 2026-11-07 this job
      # committed only the JSON with a plain `git pull --rebase`, which was safe
      # only because it generated nothing. Rebases onto $GITHUB_REF_NAME, never
      # a hardcoded main (refresh-streets once lost work rebasing a branch
      # dispatch onto main).
      - name: Commit & push if rates changed
        run: |
          bash .github/scripts/push-with-regenerate.sh \
            "Automated daily FX refresh — ExchangeRate-API [skip ci]" \
            "site/data/fx-today.json site/data/fx-history.json" \
            "site/egyptian-pound-since-july.html site/charts/egyptian-pound.svg site/charts/egyptian-pound-narrow.svg site/egypt-food-prices.html site/charts/egypt-food-prices.svg site/charts/egypt-food-prices-narrow.svg site/sitemap.xml" \
            "python backend/pipeline/build_currency_story.py && python backend/pipeline/build_food_prices.py && python backend/pipeline/sitemap_lastmod.py --changed-out /tmp/changed-urls.txt"

      # Only reached when the push succeeded or there was nothing to push.
      # Never fails the job: see indexnow_ping.py.
      - name: Announce the pages the rates changed (IndexNow)
        run: python backend/pipeline/indexnow_ping.py /tmp/changed-urls.txt

      # Runs on any outcome, because its whole job is to describe a step that
      # has already failed.
      - name: Collect what the run said about itself
        if: '!cancelled()'
        id: why
        shell: bash
        run: |
          {
            echo 'text<<FX_EOF'
            grep -E '(SKIP|FAILED|stale|unreachable|Refusing|::error::)' \
              /tmp/fx-refresh.log 2>/dev/null | head -20 || true
            echo 'FX_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Alert on failure
        # failure() alone misses a TIMEOUT: GitHub records a job killed at
        # timeout-minutes as CANCELLED, not failed - which is how the 2026-10-05
        # street refresh ran out of time and told nobody. This workflow never
        # cancels itself, so a cancellation here is a timeout or a person.
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ job.status == 'cancelled' && 'Cancelled, not failed - most often the job hit its timeout-minutes limit, which GitHub records as a cancellation. The last lines of the log show where it stopped.' || steps.why.outputs.text }}
