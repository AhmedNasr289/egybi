name: Build Atlas geo layers

# Builds the three occasionally-refreshed layers the Atlas page renders on top
# of the bundled governorate map: health facilities + school counts (both from
# OpenStreetMap via Overpass) and Egypt's UNESCO World Heritage sites. These
# change slowly, so this is MANUAL-ONLY — run it to populate the layers the
# first time, then again a few times a year to pick up new OSM mapping.
# fetch_geo_layers.py keeps last-good files per layer if a source is
# unreachable or a result looks broken, so a bad run never wipes good data.

on:
  # MONTHLY, not manual-only. The original reasoning was that these layers
  # "change slowly", and that is true of the shape of Egypt but not of
  # OpenStreetMap: hospitals, schools and places are mapped by volunteers every
  # day, so a layer built once and never refetched drifts away from its own
  # as-of date while still printing it. That is a cited-data-honesty problem
  # rather than a convenience one — the page keeps claiming a date the data no
  # longer represents. Monthly is the slowest cadence at which the claim stays
  # true, and four Overpass queries twelve times a year is a polite load on a
  # free public service.
  #
  # UNESCO's list is the other reason for monthly rather than yearly: new
  # inscriptions land at the World Heritage Committee session each summer, and
  # a site added in July should not wait until the next time somebody remembers
  # this button exists.
  schedule:
    - cron: '31 4 3 * *'       # 04:31 UTC on the 3rd of each month.
                               # Off the hour and off the 1st: both are heavily
                               # contended on GitHub's shared scheduler, and a
                               # skipped run is a silent one.
  workflow_dispatch: {}        # and still runnable by hand

permissions:
  contents: write
  issues: write             # open a failure-alert issue via notify-failure

concurrency:
  group: build-geo-assets
  cancel-in-progress: false

jobs:
  layers:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # three Overpass queries, which are the slow part.
                               # Without a bound a hung request runs for
                               # GitHub's default six hours.
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Atlas layers (stdlib only, no pip)
        run: python backend/pipeline/fetch_geo_layers.py

      # The investor map is a pure join over files already in the repo, so it
      # never needs the network — but it DOES need to re-run after the fetch,
      # because geo-industry.json is what lets a project match a power plant or
      # a port by name. Run it even when a layer failed: the join reads
      # whatever exists and reports how many rows it could place, so a skipped
      # layer costs pins rather than breaking the step.
      # build_invest_map.py reads the knowledge base out of
      # backend/test/egybi_test.sqlite, and .gitignore excludes
      # backend/test/*.sqlite — so that file exists on a developer's machine
      # and has never existed on a runner. The step below ran once, died on
      # "Missing .../egybi_test.sqlite", and turned the run red while every
      # layer it depended on had fetched perfectly. A dependency that is
      # satisfied only by an untracked local artefact is not a dependency the
      # workflow has.
      #
      # The DB is rebuilt from the committed schema and seed files instead,
      # which is where the data actually lives. It is deterministic, takes a
      # second, and means the join runs against exactly the rows in the repo.
      - name: Build the knowledge-base mirror the investor join reads
        if: '!cancelled()'
        run: python backend/test/build_test_db.py

      - name: Rebuild the investor map from whatever layers exist
        if: '!cancelled()'
        run: python backend/pipeline/build_invest_map.py

      # Runs even when the fetch step failed. The script's guardrails are
      # PER LAYER — a broken source skips only its own file and leaves the
      # others correctly written — but it still exits non-zero so the run
      # shows red. Without this condition that non-zero exit would discard
      # the layers that DID succeed, which is the opposite of the intent.
      # The run still reports failure; only the salvage is unconditional.
      - name: Commit & push whatever layers were built
        if: '!cancelled()'
        run: |
          # Only stage layers that actually exist. `git add` on a missing path
          # is a hard error (exit 128) that would abort this step under `bash
          # -e` — which is exactly how run 2 discarded two good layers because
          # a third was skipped.
          # This list is the real output contract of the run. A layer the
          # script writes but this loop does not name is built on every run and
          # then thrown away, which is silent and looks exactly like the layer
          # never being generated at all — geo-industry.json was added to the
          # fetcher and spent its first commit in that state.
          FILES=""
          for f in site/data/geo-health.json site/data/geo-schools.json \
                   site/data/geo-heritage.json site/data/geo-places.json \
                   site/data/geo-industry.json site/data/invest-projects.json; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          if [ -z "$FILES" ]; then
            echo "No layer files were built — nothing to commit."
          elif [ -n "$(git status --porcelain -- $FILES)" ]; then
            git config user.name  "egybi-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "Atlas layer refresh — OSM facilities/schools/places + UNESCO sites [skip ci]"
            for attempt in 1 2 3; do
              # Rebase against the ref this run was dispatched on. Hardcoding
              # main means a branch dispatch rewrites the branch history and the
              # push is rejected as a non-fast-forward — the same failure
              # refresh-streets hit. On main this behaves identically.
              if git pull --rebase --autostash origin "$GITHUB_REF_NAME" \
                 && git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "pushed on attempt $attempt"; exit 0
              fi
              echo "push attempt $attempt failed; retrying in 5s"; sleep 5
            done
            echo "::error::could not push after 3 attempts"; exit 1
          else
            echo "No layer changes (or guardrails kept last-good data)."
          fi

      # Same contract as every other pipeline here: if the run failed, say so
      # somewhere a human will see it. This was the only data workflow that
      # could fail silently, and a pipeline nobody is told about failing is a
      # pipeline that stays broken.
      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
