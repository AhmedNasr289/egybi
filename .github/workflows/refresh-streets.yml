name: Refresh street report card

# Builds the Cairo street-network report card and the 15-minute access layer
# for site/streets.html, then optionally writes the AI planner's notes.
#
# MANUAL ONLY, AND THAT IS DELIBERATE. Street networks change on the timescale
# of construction projects, not days — re-running this weekly would produce
# byte-identical output while hammering the public Overpass API, whose usage
# policy asks for exactly the restraint a pointless cron job fails to show.
# Run it when a district is worth re-measuring, a few times a year.
#
# Unlike every other pipeline here this one is NOT stdlib-only: OSMnx pulls in
# geopandas, shapely and networkx, and orientation_entropy additionally needs
# scipy, which osmnx does not install by default. Versions are pinned so a
# breaking upstream release cannot silently change published measurements, and
# pip is cached so a re-run does not rebuild the whole geospatial stack.

on:
  # QUARTERLY. Same argument as the Atlas layers — the street network is
  # OpenStreetMap and volunteers keep mapping it — but this job builds drive and
  # walk graphs for ten districts and is bounded at two hours, so monthly would
  # spend real Actions minutes to move figures that shift slowly at district
  # scale. Quarterly stops the report card aging silently without pretending the
  # underlying geometry changes weekly.
  schedule:
    - cron: '47 2 5 1,4,7,10 *'   # 02:47 UTC on the 5th of Jan, Apr, Jul, Oct
  workflow_dispatch:
    inputs:
      planner_notes:
        description: "Also generate the AI planner's notes (needs ANTHROPIC_API_KEY)"
        required: true
        type: choice
        default: 'no'
        options: ['no', 'yes']

permissions:
  contents: write
  issues: write             # open a failure-alert issue via notify-failure

concurrency:
  group: refresh-streets
  cancel-in-progress: false

jobs:
  streets:
    runs-on: ubuntu-latest
    # Raised from 60 after run 4 hit the ceiling. This is not a code problem to
    # engineer around: the cost is dominated by Overpass download and queuing
    # time for the WALK network, and 6th of October City at 552 km² is larger
    # than the four districts of run 3 put together. Run 3 covered four
    # districts in 19 minutes; six, including that one, does not fit in 60.
    #
    # Giving it the time it actually needs is the honest fix. Sampling the walk
    # network would be faster but would turn a measured share into an estimate,
    # so it is held back until there is evidence that more time is not enough.
    timeout-minutes: 120
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Without this, `cache: pip` hard-errors: it globs for
          # **/requirements.txt or **/pyproject.toml to hash, and every other
          # EgyBI pipeline is stdlib-only so the repo has neither at the root.
          cache-dependency-path: backend/pipeline/requirements-streets.txt

      - name: Install the geospatial stack (pinned)
        run: |
          python -m pip install --upgrade pip
          # Pins live in the requirements file, not here, so the versions the
          # cache is keyed on are the versions actually installed.
          pip install -r backend/pipeline/requirements-streets.txt

      # Tee'd for the same reason build-geo-assets is: fetch_streets.py names
      # the district and the reason whenever a guardrail keeps last-good data,
      # and that sentence was reaching nothing but the run log. This workflow
      # failed three times in a row on main while its failure issue said only
      # that it had failed.
      - name: Build the report card and access layers
        shell: bash
        run: |
          set -o pipefail
          python backend/pipeline/fetch_streets.py 2>&1 | tee /tmp/streets-fetch.log

      - name: Collect the reasons any district was skipped
        if: '!cancelled()'
        id: why
        shell: bash
        run: |
          {
            echo 'text<<STREETS_EOF'
            # Matches the vocabulary fetch_streets.py actually uses: the SKIP
            # header, the per-district '    - <name>: <reason>' lines it prints
            # underneath, and the note it emits on the success path.
            grep -E '(SKIP|FAILED|why each district|no per-district reason|^ +- .+: |note: [0-9]+ district)' \
              /tmp/streets-fetch.log | head -30 || true
            echo 'STREETS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Generate the planner's notes
        if: ${{ inputs.planner_notes == 'yes' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python backend/pipeline/build_planner_notes.py

      # Runs even when the fetch step failed. fetch_streets.py's guardrails are
      # per layer, so a broken layer keeps its last-good file while the others
      # are written correctly — and it still exits non-zero so the run shows
      # red. Without this the non-zero exit would discard the layers that DID
      # build, which is the opposite of the intent.
      - name: Commit & push whatever layers were built
        if: '!cancelled()'
        run: |
          # Stage only files that exist: `git add` on a missing path is a hard
          # error (exit 128) that would abort this step under `bash -e`.
          FILES=""
          for f in site/data/streets-districts.json site/data/streets-boundaries.json \
                   site/data/streets-access.json site/data/streets-notes.json; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          if [ -z "$FILES" ]; then
            echo "No street layers were built — nothing to commit."
          elif [ -n "$(git status --porcelain -- $FILES)" ]; then
            git config user.name  "egybi-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "Street report card refresh — OSM via OSMnx [skip ci]"
            # Rebase against the branch this run was dispatched on, not a
            # hardcoded main. Every other pipeline here is cron-or-push on main
            # so main is safe to assume; this one is workflow_dispatch-only and
            # can be aimed at any ref. Rebasing a feature branch onto main
            # rewrites its history, so the push is then rejected as a
            # non-fast-forward — discarding a 20-minute Overpass download at the
            # very last step.
            BRANCH="${GITHUB_REF_NAME}"
            echo "committing to ${BRANCH}"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
                echo "pushed on attempt $attempt"; exit 0
              fi
              echo "push attempt $attempt failed; retrying in 5s"; sleep 5
            done
            echo "::error::could not push after 3 attempts"; exit 1
          else
            echo "No changes (or the guardrails kept last-good data)."
          fi

      - name: Alert on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          reason: ${{ steps.why.outputs.text }}
