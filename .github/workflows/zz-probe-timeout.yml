# TEMPORARY PROBE - removed before merge. Proves that a step with
# `if: failure() || cancelled()` runs after the job is killed at
# timeout-minutes, which the alerting fix in this PR depends on.
name: Probe (timeout alert)

on:
  pull_request:
    paths:
      - '.github/workflows/zz-probe-timeout.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Outlive the time limit
        run: sleep 90
      - name: Runs only on failure()
        if: failure()
        run: echo "FAILURE-ONLY-STEP-RAN status=${{ job.status }}"
      - name: Runs on failure() || cancelled()
        if: failure() || cancelled()
        run: echo "ALERT-STEP-RAN status=${{ job.status }}"
